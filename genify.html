<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructions</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
.snow {
  position: fixed;
  top: -20px;
  color: white;
  pointer-events: none;
  user-select: none;
  z-index: 1;
  animation: snowfall linear infinite;
}
@keyframes snowfall {
  from { transform: translate3d(0,-30px,0) rotate(0deg); }
  to { transform: translate3d(80px,110vh,0) rotate(360deg); }
}
.container {
  position: relative;
  z-index: 5;
  width: min(90vw, 700px);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}
.logo {
  width: min(38vw, 230px);
  max-width: 230px;
  filter: drop-shadow(0 0 25px rgba(255,255,255,.18));
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.message {
  font-size: clamp(20px, 4vw, 42px);
  line-height: 1.35;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 0 18px rgba(255,255,255,.25);
}
.view-date {\n  margin-top: -12px;\n  font-size: 14px;\n  letter-spacing: 1px;\n  color: #aaa;\n}\n\n.dots::after {
  content: "";
  display: inline-block;
  width: 1.2em;
  text-align: left;
  animation: dots 1.4s steps(4,end) infinite;
}
@keyframes dots {
  0% { content: ""; }
  25% { content: "."; }
  50% { content: ".."; }
  75% { content: "..."; }
  100% { content: ""; }
}
</style>
</head>
